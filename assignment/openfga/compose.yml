# One OpenFGA server, pinned to release 1.22.1, with the in-memory datastore.
# The memory datastore keeps tuples only while the container runs. Production uses Postgres or MySQL.
# The port is published on 127.0.0.1 only. The check picks its own port with OPENFGA_PORT.
services:
  openfga:
    image: openfga/openfga:v1.22.1
    command: run
    environment:
      OPENFGA_DATASTORE_ENGINE: memory
    ports:
      - "127.0.0.1:${OPENFGA_PORT:-8080}:8080"
    mem_limit: 512m
