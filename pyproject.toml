[project]
name = "applied-ai-cohort"
version = "0.1.0"
description = "Build one AI system you can prove, on a real business job."
requires-python = ">=3.11"
dependencies = [
  "litellm==1.109.1",
]

[dependency-groups]
# The closing part, "Do it with the tools teams run". Install with: uv sync --group assignment
assignment = ["langfuse==5.2.0"]
# The part "Run the agent with Google ADK". Install with: uv sync --group adk
adk = ["google-adk==2.14.1"]

[project.scripts]
world = "worlds.cli:main"
models = "config.models_cli:main"
finished = "reference.finished:main"

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["config", "worlds", "reference"]

# Python steps follow the same readable-code rules as TypeScript. See STANDARD.md, "Readable code".
[tool.ruff]
line-length = 100

[tool.ruff.lint]
# PLR1702 (nesting depth) is a preview rule; without preview ruff ignores it and warns.
preview = true
select = ["E", "F", "W", "I", "N", "B", "SIM", "C90", "PLR0913", "PLR0915", "PLR1702"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 4
max-statements = 30
max-nested-blocks = 3
